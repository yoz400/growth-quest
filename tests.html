<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth Quest Tests</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
    background: #10131a;
    color: #f3f5f8;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 24px;
  }
  #summary {
    margin: 0 0 16px;
    padding: 12px 14px;
    border: 1px solid #3a4353;
    background: #171c26;
  }
  #summary.pass {
    border-color: #4bb774;
  }
  #summary.fail {
    border-color: #d76565;
  }
  ol {
    margin: 0;
    padding-left: 22px;
  }
  li {
    margin: 8px 0;
    line-height: 1.5;
  }
  .pass {
    color: #7be39b;
  }
  .fail {
    color: #ff8d8d;
  }
  iframe {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<h1>Growth Quest Tests</h1>
<div id="summary">実行中...</div>
<ol id="results"></ol>

<script>
(function () {
  const summary = document.getElementById('summary');
  const results = document.getElementById('results');
  const snapshot = new Map();
  const originalKeys = [];

  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    originalKeys.push(key);
    snapshot.set(key, localStorage.getItem(key));
  }

  const tests = [];
  let pass = 0;
  let fail = 0;

  function addTest(name, fn) {
    tests.push({ name, fn });
  }

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  function assertEq(actual, expected, message) {
    const a = JSON.stringify(actual);
    const e = JSON.stringify(expected);
    if (a !== e) throw new Error(`${message}: got ${a}, want ${e}`);
  }

  function show(ok, name, detail) {
    const li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = `${ok ? 'PASS' : 'FAIL'}: ${name}${detail ? ' — ' + detail : ''}`;
    results.appendChild(li);
  }

  function restoreStorage() {
    const currentKeys = [];
    for (let i = 0; i < localStorage.length; i++) currentKeys.push(localStorage.key(i));
    currentKeys.forEach(key => {
      if (!snapshot.has(key)) localStorage.removeItem(key);
    });
    originalKeys.forEach(key => {
      localStorage.setItem(key, snapshot.get(key));
    });
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function openAppFrame(width = 1, height = 1) {
    return new Promise((resolve, reject) => {
      const frame = document.createElement('iframe');
      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
      const timer = setTimeout(() => reject(new Error('index.html の読み込みが時間切れ')), 8000);
      frame.addEventListener('load', async () => {
        clearTimeout(timer);
        await wait(1600);
        resolve(frame);
      }, { once: true });
      frame.src = 'index.html?test=' + Date.now();
      document.body.appendChild(frame);
    });
  }

  async function openFreshUserFrame() {
    localStorage.clear();
    const frame = await openAppFrame();
    await wait(2200);
    return frame;
  }

  async function captureExport(win) {
    let captured = '';
    const OriginalBlob = win.Blob;
    const originalCreate = win.URL.createObjectURL;
    const originalRevoke = win.URL.revokeObjectURL;
    const originalClick = win.HTMLAnchorElement.prototype.click;

    win.Blob = class TestBlob extends OriginalBlob {
      constructor(parts, options) {
        captured = parts.map(part => String(part)).join('');
        super(parts, options);
      }
    };
    win.URL.createObjectURL = () => 'blob:gq-test';
    win.URL.revokeObjectURL = () => {};
    win.HTMLAnchorElement.prototype.click = function () {};

    try {
      win.exportAllData();
      await wait(50);
      return JSON.parse(captured);
    } finally {
      win.Blob = OriginalBlob;
      win.URL.createObjectURL = originalCreate;
      win.URL.revokeObjectURL = originalRevoke;
      win.HTMLAnchorElement.prototype.click = originalClick;
    }
  }

  async function run() {
    localStorage.setItem('gq_unlocks', JSON.stringify(['guild', 'board', 'skill', 'review']));
    localStorage.setItem('gq_summoned', '1');
    localStorage.setItem('gq_onboard_done', '1');

    const frame = await openAppFrame();
    const win = frame.contentWindow;
    const doc = frame.contentDocument;

    addTest('起動して白画面にならない', () => {
      assert(doc.body.innerText.length > 200, 'body text が少なすぎます');
      assert(!doc.getElementById('gq-fatal-error'), '起動エラー表示が出ています');
    });

    addTest('todayKey() は YYYY-MM-DD 形式の文字列を返す', () => {
      assert(/^\d{4}-\d{2}-\d{2}$/.test(win.todayKey()), win.todayKey());
    });

    addTest('壊れた gq_data でも loadData() は初期値へ戻る', () => {
      localStorage.setItem('gq_data', '{broken');
      assertEq(win.loadData().xp, 0, 'xp');
      assertEq(win.loadData().level, 1, 'level');
    });

    addTest('loadSettings() は保存済みの一部設定を初期値と合成する', () => {
      localStorage.setItem('gq_settings', JSON.stringify({ goal: 77 }));
      const settings = win.loadSettings();
      assertEq(settings.goal, 77, 'goal');
      assertEq(settings.defaultMode, 'quick', 'defaultMode');
    });

    addTest('保存済みの起動モードを5分へ上書きしない', () => {
      localStorage.setItem('gq_settings', JSON.stringify({ defaultMode: 'deep' }));
      assertEq(win.loadSettings().defaultMode, 'deep', '既存モード');
    });

    addTest('壊れた gq_genres でも loadGenres() は初期ジャンルへ戻る', () => {
      localStorage.setItem('gq_genres', '{broken');
      const genres = win.loadGenres();
      assert(Array.isArray(genres), '配列ではありません');
      assert(genres.length >= 1, '初期ジャンルが空です');
    });

    addTest('safeSetItem() は保存に成功すると true を返す', () => {
      assertEq(win.safeSetItem('gq_test_safe_set_item', 'ok'), true, 'safeSetItem');
      assertEq(localStorage.getItem('gq_test_safe_set_item'), 'ok', '保存値');
    });

    addTest('saveData() は保存後に data:changed を通知する', () => {
      let seen = false;
      const off = win.GQ.on('data:changed', payload => {
        seen = payload && payload.reason === 'tests.html';
      });
      win.saveData(Object.assign({}, win.DEFAULT_DATA, { xp: 12 }), 'tests.html');
      off();
      assert(seen, 'data:changed が届いていません');
    });

    addTest('exportAllData() は gq_ キーと growthPraiseLogs を含める', async () => {
      localStorage.setItem('gq_test_export', 'ok');
      localStorage.setItem('growthPraiseLogs', JSON.stringify({ '2026-09-01': [{ text: 'ok' }] }));
      const exported = await captureExport(win);
      assertEq(exported.data.gq_test_export, 'ok', 'gq_ key');
      assert(typeof exported.data.growthPraiseLogs === 'string', 'growthPraiseLogs がありません');
    });

    addTest('タイマー START/STOP が切り替わる', async () => {
      const start = doc.getElementById('start-btn');
      const stop = doc.getElementById('stop-btn');
      start.click();
      await wait(120);
      assertEq(start.textContent.trim(), '一時停止', 'START後の表示');
      assertEq(win.getComputedStyle(stop).display, 'flex', 'STOP表示');
      stop.click();
      await wait(120);
      assertEq(start.textContent.trim(), 'START', 'STOP後の表示');
      assertEq(win.getComputedStyle(stop).display, 'none', 'STOP非表示');
    });

    addTest('設定モーダルを開閉できる', async () => {
      doc.getElementById('settings-btn').click();
      await wait(100);
      assert(doc.getElementById('settings-overlay').classList.contains('open'), '設定が開いていません');
      doc.getElementById('settings-close-btn').click();
      await wait(100);
      assert(!doc.getElementById('settings-overlay').classList.contains('open'), '設定が閉じていません');
    });

    addTest('図鑑（バッジ）を開閉できる', async () => {
      doc.getElementById('avatar-open-badges').click();
      await wait(100);
      assert(doc.getElementById('badges-overlay').classList.contains('open'), '図鑑が開いていません');
      doc.getElementById('badges-close-btn').click();
      await wait(100);
      assert(!doc.getElementById('badges-overlay').classList.contains('open'), '図鑑が閉じていません');
    });

    addTest('カレンダー/週次レビューを開閉できる', async () => {
      doc.getElementById('review-btn').click();
      await wait(120);
      assert(doc.getElementById('review-overlay').classList.contains('open'), 'レビューが開いていません');
      doc.getElementById('review-close-btn').click();
      await wait(100);
      assert(!doc.getElementById('review-overlay').classList.contains('open'), 'レビューが閉じていません');
    });

    addTest('新規ユーザーでは召喚が自動表示される', async () => {
      frame.remove();
      const fresh = await openFreshUserFrame();
      const freshDoc = fresh.contentDocument;
      assert(freshDoc.getElementById('summon-overlay').classList.contains('open'), '召喚が開いていません');
      assertEq(freshDoc.querySelectorAll('.summon-dot').length, 3, '初回画面数');
      assertEq(fresh.contentWindow.getComputedStyle(freshDoc.getElementById('review-prompt')).visibility, 'hidden', '通知非表示');
      freshDoc.getElementById('summon-next-btn').click();
      freshDoc.getElementById('summon-next-btn').click();
      assert(!freshDoc.getElementById('summon-next-btn').disabled, 'テーマ未選択でも進める');
      freshDoc.getElementById('summon-next-btn').click();
      await wait(1800);
      assert(!freshDoc.getElementById('guide-tutorial-overlay').classList.contains('open'), '別の案内が重なっています');
      assertEq(freshDoc.getElementById('timer-display').textContent, '05:00', '初回タイマー');
      fresh.remove();
    });

    addTest('5分モードを再読み込み復元し、完了は一度だけ記録する', async () => {
      localStorage.clear();
      localStorage.setItem('gq_summoned', '1');
      localStorage.setItem('gq_guide_tutorial_seen', '1');
      localStorage.setItem('gq_timer_session', JSON.stringify({
        state: 'paused', mode: 'quick', pausedSec: 298, startWall: null,
        genreId: 'default', sessionStartHour: 12
      }));
      const restored = await openAppFrame();
      const d = restored.contentDocument;
      try {
        assertEq(d.getElementById('timer-display').textContent, '00:02', '復元した残り時間');
        assertEq(d.getElementById('start-btn').textContent, '▶ 再開', '一時停止復元');
        assertEq(d.getElementById('stop-btn').textContent, '終了して記録', '終了ボタン');
        d.getElementById('start-btn').click();
        await wait(3300);
        const saved = JSON.parse(localStorage.getItem('gq_data'));
        assertEq(saved.totalMinutes, 5, '完了分数');
        assertEq(saved.sessions, 1, '完了回数');
        assertEq(localStorage.getItem('gq_timer_session'), null, '復元状態の解除');
        assert(!d.getElementById('break-banner').classList.contains('visible'), '休憩を自動開始しない');
        d.getElementById('stop-btn').click();
        assertEq(JSON.parse(localStorage.getItem('gq_data')).sessions, 1, '重複記録なし');
      } finally { restored.remove(); }
    });

    addTest('途中終了は実時間だけ記録し、1分未満は記録しない', async () => {
      for (const seconds of [30, 65]) {
        localStorage.clear();
        localStorage.setItem('gq_summoned', '1');
        localStorage.setItem('gq_guide_tutorial_seen', '1');
        localStorage.setItem('gq_timer_session', JSON.stringify({
          state: 'paused', mode: 'quick', pausedSec: seconds, startWall: null,
          genreId: 'default', sessionStartHour: 12
        }));
        const partial = await openAppFrame();
        try {
          partial.contentDocument.getElementById('stop-btn').click();
          const saved = JSON.parse(localStorage.getItem('gq_data'));
          assertEq(saved.totalMinutes, Math.floor(seconds / 60), '実時間だけ記録');
          assertEq(localStorage.getItem('gq_timer_session'), null, '終了状態');
        } finally { partial.remove(); }
      }
    });

    addTest('レビュー通知は記録のある週だけ表示し、モーダル中は隠れる', async () => {
      for (const hasRecords of [false, true]) {
        localStorage.clear();
        localStorage.setItem('gq_summoned', '1');
        localStorage.setItem('gq_guide_tutorial_seen', '1');
        localStorage.setItem('gq_unlocks', JSON.stringify(['review']));
        localStorage.setItem('gq_data', JSON.stringify({
          sessions: 4, history: hasRecords ? { '2026-10-18': 5 } : {}
        }));
        const review = await openAppFrame();
        const w = review.contentWindow, d = review.contentDocument;
        const RealDate = w.Date;
        try {
          w.Overlay.close('login-bonus-overlay');
          w.Date = class extends RealDate {
            constructor(...args) { super(...(args.length ? args : ['2026-10-18T21:00:00'])); }
          };
          w.checkWeeklyReviewTrigger();
          await wait(2600);
          const p = d.getElementById('review-prompt');
          assertEq(p.classList.contains('show'), hasRecords, '対象週の記録と表示');
          if (hasRecords) {
            d.getElementById('settings-btn').click();
            await wait(900);
            assertEq(w.getComputedStyle(p).visibility, 'hidden', 'モーダル中の非表示');
            d.getElementById('settings-close-btn').click();
            await wait(900);
            assertEq(w.getComputedStyle(p).visibility, 'visible', '閉じた後の再表示');
            d.getElementById('review-prompt-open').click();
            assert(d.getElementById('review-overlay').classList.contains('open'), '週次レビューへ移動');
          }
        } finally { w.Date = RealDate; review.remove(); }
      }
    });

    addTest('狭い画面・7ジャンルでも開始と終了ボタンが横にはみ出さない', async () => {
      localStorage.clear();
      localStorage.setItem('gq_summoned', '1');
      localStorage.setItem('gq_guide_tutorial_seen', '1');
      localStorage.setItem('gq_genres', JSON.stringify(
        ['学習', '読書', 'プログラミング', '英語', '運動', '音楽', '創作'].map((name, i) =>
          ({ id: 'layout-' + i, name, emoji: '📖', color: '#06b6d4', xp: 0, minutes: 0 }))
      ));
      for (const width of [320, 375]) {
        const layout = await openAppFrame(width, 667);
        try {
          const d = layout.contentDocument;
          const start = d.getElementById('start-btn');
          start.click();
          for (const el of [start, d.getElementById('stop-btn')]) {
            const r = el.getBoundingClientRect();
            assert(r.left >= 0 && r.right <= width, 'ボタンが横にはみ出しています: ' + width);
          }
          assert(start.getBoundingClientRect().bottom <= 667, 'STARTが最初の画面内にありません: ' + width);
          d.getElementById('stop-btn').click();
        } finally { layout.remove(); }
      }
    });

    for (const test of tests) {
      try {
        await test.fn();
        pass++;
        show(true, test.name);
      } catch (err) {
        fail++;
        show(false, test.name, err && err.message ? err.message : String(err));
        console.error(err);
      }
    }
  }

  run()
    .catch(err => {
      fail++;
      show(false, 'テスト実行', err && err.message ? err.message : String(err));
      console.error(err);
    })
    .finally(() => {
      restoreStorage();
      summary.textContent = `${pass} passed, ${fail} failed`;
      summary.className = fail ? 'fail' : 'pass';
    });
})();
</script>
</body>
</html>
